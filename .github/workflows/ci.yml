name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 12 supports PHP 8.2–8.5 and Testbench 10.
          - php: "8.2"
            laravel: "12.*"
            testbench: "10.*"
          - php: "8.3"
            laravel: "12.*"
            testbench: "10.*"
          - php: "8.4"
            laravel: "12.*"
            testbench: "10.*"
          - php: "8.5"
            laravel: "12.*"
            testbench: "10.*"
          # Laravel 13 requires PHP 8.3+ and Testbench 11.
          - php: "8.3"
            laravel: "13.*"
            testbench: "11.*"
          - php: "8.4"
            laravel: "13.*"
            testbench: "11.*"
          - php: "8.5"
            laravel: "13.*"
            testbench: "11.*"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Require Laravel ${{ matrix.laravel }}
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Rector dry-run
        run: vendor/bin/rector process --dry-run

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run tests (Pest)
        run: vendor/bin/pest --ci
